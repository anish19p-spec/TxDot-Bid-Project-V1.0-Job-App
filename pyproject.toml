[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txdot-bid-analysis"
version = "0.1.0"
description = "Foundation for auditable TxDOT aviation bid comparisons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "pdfplumber>=0.11,<0.12",
  "openpyxl>=3.1,<4",
  "reportlab>=4,<6",
  "google-genai>=1,<3",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
]


[project.scripts]
txdot-bids = "txdot_bid_analysis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
